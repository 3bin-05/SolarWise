<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="7" fill="#FE5A01" />
  <!-- Solar Sunburst in White -->
  <circle cx="16" cy="16" r="3.6" stroke="#FFFFFF" stroke-width="2.2" fill="#FFFFFF" fill-opacity="0.25" />
  <!-- Cardinal rays -->
  <line x1="16" y1="4.5" x2="16" y2="9.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
  <line x1="16" y1="22.5" x2="16" y2="27.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
  <line x1="4.5" y1="16" x2="9.5" y2="16" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
  <line x1="22.5" y1="16" x2="27.5" y2="16" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
  <!-- Diagonal rays -->
  <line x1="7.9" y1="7.9" x2="11.4" y2="11.4" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
  <line x1="20.6" y1="20.6" x2="24.1" y2="24.1" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
  <line x1="7.9" y1="24.1" x2="11.4" y2="20.6" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
  <line x1="20.6" y1="11.4" x2="24.1" y2="7.9" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
</svg>
