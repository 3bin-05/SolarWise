<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FE5A01" />
    <meta
      name="description"
      content="SolarWise — Intelligent rooftop solar feasibility assessment, clean energy transition, and real-time household decarbonization platform."
    />
    <title>SolarWise — Clean Energy & Decarbonization</title>

    <!-- SolarWise Modern Minimal Preloader Styles (Instant First Paint) -->
    <style>
      #solarwise-preloader {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #fafbfc;
        transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.5s;
      }

      #solarwise-preloader.sw-fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* Minimal top hairline loader */
      .sw-top-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 2.5px;
        background: rgba(254, 90, 1, 0.15);
        overflow: hidden;
      }

      .sw-top-loader-bar {
        height: 100%;
        width: 40%;
        background: #FE5A01;
        border-radius: 9999px;
        animation: sw-bar-slide 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .sw-preloader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        user-select: none;
      }

      .sw-emblem-wrap {
        width: 52px;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 14px;
      }

      .sw-emblem-svg {
        width: 44px;
        height: 44px;
        animation: sw-gentle-pulse 2s ease-in-out infinite;
      }

      .sw-brand {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.5px;
        color: #0f172a;
        display: flex;
        align-items: center;
        gap: 1px;
      }

      .sw-brand-accent {
        color: #FE5A01;
      }

      .sw-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 11px;
        font-weight: 600;
        color: #64748b;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        margin-top: 4px;
      }

      @keyframes sw-bar-slide {
        0% { transform: translateX(-100%); width: 20%; }
        50% { transform: translateX(100%); width: 60%; }
        100% { transform: translateX(300%); width: 20%; }
      }

      @keyframes sw-gentle-pulse {
        0%, 100% { transform: scale(1); opacity: 0.95; }
        50% { transform: scale(1.05); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <!-- SolarWise Modern Minimal Preloader -->
    <div id="solarwise-preloader" aria-label="Loading SolarWise Platform">
      <div class="sw-top-loader">
        <div class="sw-top-loader-bar"></div>
      </div>
      <div class="sw-preloader-content">
        <div class="sw-emblem-wrap">
          <svg
            class="sw-emblem-svg"
            viewBox="0 0 28 28"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <!-- Inner ring -->
            <circle cx="14" cy="14" r="3.2" stroke="#FE5A01" stroke-width="2.2" fill="#FE5A01" fill-opacity="0.25" />
            <!-- Cardinal rays -->
            <line x1="14" y1="2" x2="14" y2="6.8" stroke="#FE5A01" stroke-width="2.2" stroke-linecap="round" />
            <line x1="14" y1="21.2" x2="14" y2="26" stroke="#FE5A01" stroke-width="2.2" stroke-linecap="round" />
            <line x1="2" y1="14" x2="6.8" y2="14" stroke="#FE5A01" stroke-width="2.2" stroke-linecap="round" />
            <line x1="21.2" y1="14" x2="26" y2="14" stroke="#FE5A01" stroke-width="2.2" stroke-linecap="round" />
            <!-- Diagonal rays -->
            <line x1="5.5" y1="5.5" x2="8.9" y2="8.9" stroke="#FE5A01" stroke-width="2.2" stroke-linecap="round" />
            <line x1="19.1" y1="19.1" x2="22.5" y2="22.5" stroke="#FE5A01" stroke-width="2.2" stroke-linecap="round" />
            <line x1="5.5" y1="22.5" x2="8.9" y2="19.1" stroke="#FE5A01" stroke-width="2.2" stroke-linecap="round" />
            <line x1="19.1" y1="8.9" x2="22.5" y2="5.5" stroke="#FE5A01" stroke-width="2.2" stroke-linecap="round" />
          </svg>
        </div>

        <div class="sw-brand">
          Solar<span class="sw-brand-accent">wise</span>
        </div>
        <div class="sw-subtitle">Clean Energy Platform</div>
      </div>
    </div>

    <script>
      (function() {
        var startTime = Date.now();
        var MIN_DISPLAY_MS = 2500; // Guaranteed dwell time of ~2.5 seconds for visual polish
        var MAX_TIMEOUT_MS = 5000; // Safety fallback for slow or stalled network connections

        function dismiss() {
          var preloader = document.getElementById('solarwise-preloader');
          if (preloader && !preloader.classList.contains('sw-fade-out')) {
            preloader.classList.add('sw-fade-out');
            setTimeout(function() {
              if (preloader && preloader.parentNode) {
                preloader.parentNode.removeChild(preloader);
              }
            }, 550);
          }
        }

        function scheduleDismiss() {
          var elapsed = Date.now() - startTime;
          var remaining = Math.max(0, MIN_DISPLAY_MS - elapsed);
          setTimeout(dismiss, remaining);
        }

        if (document.readyState === 'complete') {
          scheduleDismiss();
        } else {
          window.addEventListener('load', scheduleDismiss);
          setTimeout(dismiss, MAX_TIMEOUT_MS);
        }
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
